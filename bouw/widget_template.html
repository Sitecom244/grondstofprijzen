document.title = T.title + ' | ' + (SHOP === 'de' ? 'VerpackungenXL' : 'VerpakkingenXL');

function fmtDate(iso, long) {
  const [y, m, d] = iso.split('-').map(Number);
  const dd = LANG === 'de' ? d + '.' : d;
  return long ? dd + ' ' + T.monthsLong[m-1] + ' ' + y
              : dd + ' ' + MONTHS[m-1] + ' ' + y;
}
function pct(a, b) { return (a == null || b == null || !b) ? null : (a / b - 1) * 100; }
function signPct(v) { return v == null ? T.na : (v > 0 ? '+' : '') + nf1.format(v) + '%'; }
function lastIdx(arr) { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i; return -1; }

const VIEW = params.get('view') === 'calculator' ? 'calc' : 'grafiek';
document.getElementById('viewGrafiek').hidden = VIEW !== 'grafiek';
document.getElementById('viewCalc').hidden = VIEW !== 'calc';

/* ---------- GRAFIEK ---------- */
const state = { market: 'DE', range: '52', mode: 'price', on: new Set(['LDPE','LLDPE','HDPE']) };

function setupSeg(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    render();
  });
}

function buildChips() {
  const c = document.getElementById('chips');
  c.innerHTML = '';
  ORDER.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.p = p;
    b.setAttribute('aria-pressed', state.on.has(p) ? 'true' : 'false');
    b.title = T.usedFor + POLY[p].desc;
    b.innerHTML = '<span class="dot" style="background:' + POLY[p].color + '"></span>' + POLY[p].name;
    b.addEventListener('click', () => {
      if (state.on.has(p)) { if (state.on.size > 1) state.on.delete(p); } else state.on.add(p);
      b.setAttribute('aria-pressed', state.on.has(p) ? 'true' : 'false');
      render();
    });
    c.appendChild(b);
  });
}

function windowed() {
  const m = DATA.markets[state.market];
  const n = m.dates.length;
  const start = state.range === 'all' ? 0 : Math.max(0, n - Number(state.range) - 1);
  return { m, start, end: n - 1 };
}

function renderTiles() {
  const m = DATA.markets[state.market];
  const t = document.getElementById('tiles');
  t.innerHTML = '';
  ORDER.filter(p => state.on.has(p)).forEach(p => {
    const s = m.series[p]; const i = lastIdx(s);
    const d4 = pct(s[i], s[i-4]); const d52 = pct(s[i], s[i-52]);
    const cls = v => v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : '';
    const el = document.createElement('div');
    el.className = 'tile'; el.style.borderLeftColor = POLY[p].color;
    el.innerHTML = '<div class="n"><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:' + POLY[p].color + '"></span>' + POLY[p].name + (window.innerWidth > 560 ? ' · ' + MARKET[state.market] : '') + '</div>' +
      '<div class="v">' + nf.format(s[i]) + ' <small>' + T.perTon + '</small></div>' +
      '<div class="d">' + T.w4 + ': <span class="' + cls(d4) + '">' + signPct(d4) + '</span> · ' + T.y1 + ': <span class="' + cls(d52) + '">' + signPct(d52) + '</span></div>';
    t.appendChild(el);
  });
}

let geom = null;
function renderChart() {
  const svg = document.getElementById('chart');
  const W = Math.max(320, svg.parentNode.clientWidth);
  const H = W < 560 ? 300 : W < 800 ? 360 : 420;
  const pad = { l: 52, r: W < 560 ? 54 : 70, t: 14, b: 30 };
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const { m, start, end } = windowed();
  const dates = m.dates.slice(start, end + 1);
  const keys = ORDER.filter(p => state.on.has(p));
  const series = keys.map(p => {
    const raw = m.series[p].slice(start, end + 1);
    let base = raw.find(v => v != null);
    const vals = state.mode === 'index' ? raw.map(v => v == null ? null : v / base * 100) : raw;
    return { p, vals, raw };
  });
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.vals.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  const span = hi - lo || 1;
  const step = niceStep(span / 5);
  lo = Math.floor((lo - span * 0.05) / step) * step; hi = Math.ceil((hi + span * 0.05) / step) * step;
  const x = i => pad.l + (W - pad.l - pad.r) * (dates.length === 1 ? 0 : i / (dates.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  let h = '<g class="grid">';
  for (let v = lo; v <= hi + 1e-9; v += step) h += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
  h += '</g><g class="axis">';
  for (let v = lo; v <= hi + 1e-9; v += step) h += '<text x="' + (pad.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + nf.format(Math.round(v)) + '</text>';
  // x ticks: first week of month, thinned
  const ticks = [];
  dates.forEach((d, i) => { if (i === 0 || d.slice(5, 7) !== dates[i-1].slice(5, 7)) ticks.push(i); });
  const every = Math.ceil(ticks.length / (W < 560 ? 4 : 8));
  ticks.filter((_, k) => k % every === 0).forEach(i => {
    const [yy, mm] = dates[i].split('-').map(Number);
    h += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + MONTHS[mm-1] + " '" + String(yy).slice(2) + '</text>';
  });
  h += '</g>';
  if (state.mode === 'index') h += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(100) + '" y2="' + y(100) + '" stroke="#bbb" stroke-dasharray="4 4"/>';
  // lines
  const ends = [];
  series.forEach(s => {
    let d = '', pen = false;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; });
    h += '<path d="' + d + '" fill="none" stroke="' + POLY[s.p].color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const li = lastIdx(s.vals);
    ends.push({ p: s.p, y: y(s.vals[li]), x: x(li) });
  });
  // direct end labels, de-collided
  ends.sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k-1].y < 14) ends[k].y = ends[k-1].y + 14;
  ends.forEach(e => {
    h += '<circle cx="' + e.x + '" cy="' + e.y + '" r="0"/>';
    h += '<text x="' + (W - pad.r + 8) + '" y="' + (e.y + 4) + '" font-size="12" font-weight="600" fill="#333">' + POLY[e.p].name + '</text>';
  });
  h += '<line id="xh" y1="' + pad.t + '" y2="' + (H - pad.b) + '" stroke="#999" stroke-width="1" visibility="hidden"/>';
  h += '<g id="dots"></g>';
  h += '<rect id="hit" x="' + pad.l + '" y="' + pad.t + '" width="' + (W - pad.l - pad.r) + '" height="' + (H - pad.t - pad.b) + '" fill="transparent"/>';
  svg.innerHTML = h;
  geom = { W, H, pad, x, y, dates, series };
  const hit = svg.querySelector('#hit');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((cx - pad.l) / (W - pad.l - pad.r) * (dates.length - 1))));
    showTip(i, r);
  };
  hit.addEventListener('mousemove', move);
  hit.addEventListener('touchstart', move, { passive: true });
  hit.addEventListener('touchmove', move, { passive: true });
  hit.addEventListener('mouseleave', hideTip);
}

function showTip(i, r) {
  const { W, x, y, dates, series } = geom;
  const svg = document.getElementById('chart');
  const xh = svg.querySelector('#xh');
  xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
  let dots = '';
  let rows = '';
  series.slice().sort((a, b) => (b.vals[i] ?? -1) - (a.vals[i] ?? -1)).forEach(s => {
    const v = s.vals[i]; if (v == null) return;
    dots += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="' + POLY[s.p].color + '" stroke="#fff" stroke-width="2"/>';
    const shown = state.mode === 'index' ? nf1.format(v) : nf.format(v);
    rows += '<div class="r"><span><i class="sw" style="background:' + POLY[s.p].color + '"></i>' + POLY[s.p].name + '</span><span>' + shown + '</span></div>';
  });
  svg.querySelector('#dots').innerHTML = dots;
  const tip = document.getElementById('tip');
  tip.innerHTML = '<div class="t">' + T.weekOf + ' ' + fmtDate(dates[i]) + '</div>' + rows + (state.mode === 'index' ? '' : '<div class="note" style="margin-top:4px">' + T.perTon + '</div>');
  tip.style.display = 'block';
  const scale = r.width / W;
  let left = x(i) * scale + 14;
  if (left + tip.offsetWidth > r.width) left = x(i) * scale - tip.offsetWidth - 14;
  tip.style.left = Math.max(0, left) + 'px';
  const ys = series.map(s => s.vals[i]).filter(v => v != null).map(v => y(v) * scale);
  const th = tip.offsetHeight, ch = r.height;
  let top = Math.max(...ys) + 14;
  if (top + th > ch) top = Math.min(...ys) - th - 14;
  tip.style.top = Math.max(0, Math.min(top, ch - th)) + 'px';
}
function hideTip() {
  document.getElementById('tip').style.display = 'none';
  const svg = document.getElementById('chart');
  const xh = svg.querySelector('#xh'); if (xh) xh.setAttribute('visibility', 'hidden');
  const d = svg.querySelector('#dots'); if (d) d.innerHTML = '';
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

function renderTable() {
  const m = DATA.markets[state.market];
  const keys = ORDER.filter(p => state.on.has(p));
  let h = '<thead><tr><th>' + T.weekOf + '</th>' + keys.map(p => '<th>' + POLY[p].name + '</th>').join('') + '</tr></thead><tbody>';
  for (let i = m.dates.length - 1; i >= Math.max(0, m.dates.length - 26); i--) {
    h += '<tr><td>' + fmtDate(m.dates[i]) + '</td>' + keys.map(p => '<td>' + (m.series[p][i] == null ? '–' : nf.format(m.series[p][i])) + '</td>').join('') + '</tr>';
  }
  document.getElementById('table').innerHTML = h + '</tbody>';
}

function render() { renderTiles(); renderChart(); renderTable(); }

if (VIEW === 'grafiek') {
  document.getElementById('lastDate').textContent = fmtDate(DATA.updated, true);
  const UPD = UPDATE && (UPDATE[LANG] || (UPDATE.text ? UPDATE : null));
  if (UPD && UPD.text) {
    document.getElementById('updateBox').hidden = false;
    document.getElementById('updateTitle').textContent = UPD.title;
    document.getElementById('updateText').textContent = UPD.text;
    document.getElementById('updateBy').textContent = UPD.by + ' · ' + fmtDate(UPD.date, true);
  }
  setupSeg('segMarket', 'market'); setupSeg('segRange', 'range'); setupSeg('segMode', 'mode');
  buildChips(); render();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderChart, 120); });
}

/* ---------- CALCULATOR ---------- */
const PRODUCTS = [
  { id: 'stretch', poly: 'LLDPE' }, { id: 'coex', poly: 'LDPE' }, { id: 'nop', poly: 'LDPE' }, { id: 'ldpe', poly: 'LDPE' }, { id: 'hdpe', poly: 'HDPE' }
].map(p => Object.assign(p, { name: T.prod[p.id], url: URLS[p.id] }));
const SHARE_LO = 0.60, SHARE_HI = 0.70;

function calcSetup() {
  const sel = document.getElementById('cProduct');
  PRODUCTS.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; sel.appendChild(o); });
  const pr = params.get('product'); if (pr && PRODUCTS.some(p => p.id === pr)) sel.value = pr;
  ['cProduct','cPeriod'].forEach(id => document.getElementById(id).addEventListener('change', fillPct));
  document.getElementById('cPct').addEventListener('input', () => { document.getElementById('cPeriod').value = 'custom'; document.getElementById('cPctHint').textContent = T.custHint; });
  ['cProduct','cPeriod','cSpend','cPct'].forEach(id => { const el = document.getElementById(id); el.addEventListener('input', calc); el.addEventListener('change', calc); });
  fillPct(); calc();
}
function product() { return PRODUCTS.find(p => p.id === document.getElementById('cProduct').value); }
function fillPct() {
  const p = product();
  document.getElementById('cPolyHint').textContent = T.polyHint(POLY[p.poly].name);
  const per = document.getElementById('cPeriod').value;
  const hint = document.getElementById('cPctHint');
  if (per === 'custom') { hint.textContent = T.custHint; return; }
  const s = DATA.markets.DE.series[p.poly]; const d = DATA.markets.DE.dates;
  const i = lastIdx(s); const j = Math.max(0, i - Number(per));
  const v = pct(s[i], s[j]);
  document.getElementById('cPct').value = v == null ? '' : v.toFixed(1);
  hint.textContent = T.moved(POLY[p.poly].name, nf.format(s[j]), fmtDate(d[j]), nf.format(s[i]), fmtDate(d[i]));
}
function calc() {
  const p = product();
  const spend = parseFloat(String(document.getElementById('cSpend').value).replace(',', '.'));
  const g = parseFloat(String(document.getElementById('cPct').value).replace(',', '.'));
  const out = document.getElementById('out');
  if (!(spend > 0) || isNaN(g)) { out.innerHTML = '<div class="verdict" style="background:#fff6e5;border-left-color:#d98a00">' + T.fillIn + '</div>'; return; }
  const lo = spend * g / 100 * SHARE_LO, hi = spend * g / 100 * SHARE_HI;
  const pLo = g * SHARE_LO, pHi = g * SHARE_HI;
  const rising = g >= 0;
  const range = (a, b) => eur.format(Math.abs(Math.min(a, b))) + T.to + eur.format(Math.abs(Math.max(a, b)));
  const verdict = g === 0 ? T.noMove
    : (rising ? T.up(LANG === 'de' ? p.name : p.name.toLowerCase(), range(lo, hi)) : T.down(LANG === 'de' ? p.name : p.name.toLowerCase(), range(lo, hi)));
  out.innerHTML = '<div class="verdict">' + verdict + '</div>' +
    '<div class="rows">' +
      '<div class="row"><span>' + T.rGrond + POLY[p.poly].name + '</span><span>' + signPct(g) + '</span></div>' +
      '<div class="row"><span>' + T.rShare + '</span><span>60' + T.to + '70%</span></div>' +
      '<div class="row"><span>' + T.rEffect + '</span><span>' + signPct(Math.min(pLo, pHi)).replace('%','') + T.to + signPct(Math.max(pLo, pHi)) + '</span></div>' +
      '<div class="row"><span>' + T.rNow + '</span><span>' + eur.format(spend) + '</span></div>' +
      '<div class="row"><span>' + T.rAfter + '</span><span>' + eur.format(spend + Math.min(lo, hi)) + T.to + eur.format(spend + Math.max(lo, hi)) + '</span></div>' +
    '</div>' +
    '<p class="note">' + T.note + ' <a href="' + p.url + '" target="_top" style="color:#0b99bc;font-weight:600">' + T.view_ + (LANG === 'de' ? p.name : p.name.toLowerCase()) + ' →</a></p>';
}
if (VIEW === 'calc') calcSetup();
</script>
